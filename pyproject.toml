[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quanto"
version = "0.1.0"
description = "A-share industry ETF rotation research backtest"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "pydantic>=2.12,<3",
  "jsonschema>=4.25,<5",
  "pyarrow>=21,<24",
  "psutil>=7,<8",
]

[project.scripts]
quanto = "quanto.cli:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx2>=2,<3",
]
data = [
  "akshare>=1.13",
]
web = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]
learning = [
    "torch>=2.8,<3",
    "stable-baselines3==2.9.0",
    "gymnasium>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
